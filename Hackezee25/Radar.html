<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 WiFi Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #0a0a0a;
            color: #00ff41;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
            border-radius: 50%;
        }
        .btn {
            background-color: #00ff41;
            color: #000;
            border: 2px solid #00ff41;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #000;
            color: #00ff41;
        }
        .btn:disabled {
            background-color: #333;
            color: #888;
            border-color: #555;
            cursor: not-allowed;
        }
        .ip-input {
            background-color: #222;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 10px;
            margin-right: 10px;
            text-align: center;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen m-0 p-4">

    <div class="w-full max-w-4xl text-center mb-4">
        <h1 class="text-3xl font-bold tracking-widest">DUAL SONAR RADAR (WIFI)</h1>
        <p id="status" class="text-lg text-yellow-400">Status: Disconnected</p>
    </div>

    <div class="relative w-full max-w-xl aspect-square">
        <canvas id="radarCanvas"></canvas>
    </div>

    <div class="mt-4 flex items-center">
        <input type="text" id="ipAddressInput" class="ip-input" placeholder="Enter Rover IP Address">
        <button id="connectButton" class="btn">CONNECT</button>
    </div>
    
    <div class="absolute bottom-4 left-4 text-left text-lg">
        <p id="distance2_readout" class="text-red-400 font-bold">Front Sensor: --- m</p>
        <p id="distance1_readout" class="text-blue-400 font-bold">Rear Sensor: --- m</p>
    </div>

    <script>
        const connectButton = document.getElementById('connectButton');
        const ipAddressInput = document.getElementById('ipAddressInput');
        const statusDisplay = document.getElementById('status');
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        
        const readout1 = document.getElementById('distance1_readout');
        const readout2 = document.getElementById('distance2_readout');

        const maxDistance = 200;
        let socket;
        let currentAngle = 0;
        let points = [];

        // Try to load the last used IP address from local storage
        ipAddressInput.value = localStorage.getItem('roverIP') || '';

        function resizeCanvas() {
            const size = canvas.parentElement.clientWidth;
            canvas.width = size;
            canvas.height = size;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class RadarPoint {
            constructor(angle, distance, color) {
                this.angle = angle;
                this.distance = distance;
                this.color = color;
                this.lifespan = 255;
            }
            update() { this.lifespan -= 1.5; }
            isDead() { return this.lifespan < 0; }
        }

        connectButton.addEventListener('click', () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                disconnect();
            } else {
                connect();
            }
        });
        
        function connect() {
            const ipAddress = ipAddressInput.value.trim();
            if (!ipAddress) {
                alert('Please enter the IP address of the rover.');
                return;
            }
            // Save the IP for next time
            localStorage.setItem('roverIP', ipAddress);

            statusDisplay.textContent = `Status: Connecting to ws://${ipAddress}:81...`;
            socket = new WebSocket(`ws://${ipAddress}:81/`);

            socket.onopen = () => {
                statusDisplay.textContent = 'Status: Connected';
                connectButton.textContent = 'DISCONNECT';
            };

            socket.onmessage = (event) => {
                processLine(event.data);
            };

            socket.onclose = () => {
                statusDisplay.textContent = 'Status: Disconnected';
                connectButton.textContent = 'CONNECT';
            };

            socket.onerror = (error) => {
                statusDisplay.textContent = 'Status: Connection Error';
                console.error('WebSocket Error:', error);
            };
        }

        function disconnect() {
            if (socket) {
                socket.close();
            }
        }

        function processLine(line) {
            if (!line) return;
            const parts = line.split(',');
            if (parts.length === 3) {
                const angle = parseFloat(parts[0]);
                const dist1 = parseFloat(parts[1]); // Rear sensor
                const dist2 = parseFloat(parts[2]); // Front sensor
                
                currentAngle = angle;

                readout1.textContent = `Rear Sensor:  ${dist1 > 0 ? (dist1 / 100).toFixed(2) : '---'} m`;
                readout2.textContent = `Front Sensor: ${dist2 > 0 ? (dist2 / 100).toFixed(2) : '---'} m`;
                
                if (dist1 > 0 && dist1 < maxDistance) {
                    const oppositeAngle = angle + 180;
                    points.push(new RadarPoint(oppositeAngle, dist1, 'rgba(100, 150, 255,'));
                }
                if (dist2 > 0 && dist2 < maxDistance) {
                    points.push(new RadarPoint(angle, dist2, 'rgba(255, 100, 100,'));
                }
            }
        }

        // --- Canvas Drawing Logic (Identical to before) ---
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxRadius = Math.min(centerX, centerY) - 20;
            drawRadarGrid(centerX, centerY, maxRadius);
            drawPoints(centerX, centerY, maxRadius);
            drawSweepingLine(centerX, centerY, maxRadius);
            drawLabels(centerX, centerY, maxRadius);
            requestAnimationFrame(draw);
        }
        function drawRadarGrid(x, y, r) {
            ctx.strokeStyle = 'rgba(0, 255, 65, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 4; i++) {
                ctx.beginPath();
                ctx.arc(x, y, r * (i / 4), 0, 2 * Math.PI);
                ctx.stroke();
            }
            for (let i = 0; i < 360; i += 30) {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + r * Math.cos(i * Math.PI / 180), y + r * Math.sin(i * Math.PI / 180));
                ctx.stroke();
            }
        }
        function drawSweepingLine(x, y, r) {
            ctx.save();
            ctx.translate(x, y);
            const angleRad = (currentAngle - 90) * Math.PI / 180;
            const gradient = ctx.createLinearGradient(0, 0, r * Math.cos(angleRad), r * Math.sin(angleRad));
            gradient.addColorStop(0, 'rgba(255, 100, 100, 0)');
            gradient.addColorStop(1, 'rgba(255, 100, 100, 0.8)');
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(r * Math.cos(angleRad), r * Math.sin(angleRad));
            ctx.stroke();
            const oppositeAngleRad = (currentAngle + 180 - 90) * Math.PI / 180;
            const oppositeGradient = ctx.createLinearGradient(0, 0, r * Math.cos(oppositeAngleRad), r * Math.sin(oppositeAngleRad));
            oppositeGradient.addColorStop(0, 'rgba(100, 150, 255, 0)');
            oppositeGradient.addColorStop(1, 'rgba(100, 150, 255, 0.7)');
            ctx.strokeStyle = oppositeGradient;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(r * Math.cos(oppositeAngleRad), r * Math.sin(oppositeAngleRad));
            ctx.stroke();
            ctx.restore();
        }
        function drawPoints(x, y, r) {
            points = points.filter(p => !p.isDead());
            points.forEach(p => {
                p.update();
                const mappedR = (p.distance / maxDistance) * r;
                const angleRad = (p.angle - 90) * Math.PI / 180;
                const pointX = x + mappedR * Math.cos(angleRad);
                const pointY = y + mappedR * Math.sin(angleRad);
                ctx.fillStyle = `${p.color} ${p.lifespan / 255})`;
                ctx.beginPath();
                ctx.arc(pointX, pointY, 4, 0, 2 * Math.PI);
                ctx.fill();
            });
        }
        function drawLabels(x, y, r){
            ctx.fillStyle = '#00ff41';
            ctx.font = '14px Consolas';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('0°', x, y - r - 10);
            ctx.fillText('90°', x + r + 15, y);
            ctx.fillText('180°', x, y + r + 10);
            ctx.fillText('270°', x - r - 20, y);
             for (let i = 1; i <= 4; i++) {
                const dist = Math.round(maxDistance * (i / 4));
                ctx.fillText(`${dist}`, x + 5, y - (r * (i / 4)));
            }
        }
        draw();
    </script>
</body>
</html>
